<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="t"><title id="t">Azure subscriptions and shared delivery architecture</title><rect width="960" height="370" fill="#0a0e1a"/><rect x="25" y="30" width="270" height="95" rx="6" fill="#141c30" stroke="#22d3ee"/><text x="39" y="57" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Shared delivery</text><text x="39" y="83" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">GitHub source and Azure DevOps</text><text x="39" y="110" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">One ZIP package and SHA-256</text><rect x="25" y="165" width="270" height="115" rx="6" fill="#141c30" stroke="#22d3ee"/><text x="39" y="192" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Dev foundation package store</text><text x="39" y="218" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">sub-app-nonprod</text><text x="39" y="245" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">All deployment identities read packages</text><rect x="345" y="30" width="265" height="250" rx="6" fill="#141c30" stroke="#22d3ee"/><text x="359" y="57" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Development and testing</text><text x="359" y="83" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">sub-app-nonprod</text><text x="359" y="110" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Dev: 10.10.0.0/16</text><text x="359" y="137" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Test: 10.20.0.0/16</text><text x="359" y="164" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Separate state, identities and VNets</text><text x="359" y="191" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Shared non-production monitoring</text><rect x="660" y="30" width="265" height="250" rx="6" fill="#141c30" stroke="#22d3ee"/><text x="674" y="57" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Production</text><text x="674" y="83" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">sub-app-prod</text><text x="674" y="110" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Prod: 10.30.0.0/16</text><text x="674" y="137" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Own state, identities and monitoring</text><text x="674" y="164" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Application and infrastructure approvals</text><text x="674" y="191" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11">Reader, VM login and PIM</text><line x1="160" y1="125" x2="160" y2="165" stroke="#4ade80" stroke-width="2"/><line x1="295" y1="215" x2="345" y2="215" stroke="#4ade80" stroke-width="2"/><line x1="160" y1="280" x2="160" y2="300" stroke="#4ade80" stroke-width="2"/><line x1="160" y1="300" x2="790" y2="300" stroke="#4ade80" stroke-width="2"/><line x1="790" y1="300" x2="790" y2="280" stroke="#4ade80" stroke-width="2"/><text x="350" y="336" fill="#22d3ee" font-family="Arial,sans-serif" font-size="14">No peering between environment VNets. Each private DNS zone links to its own VNet.</text></svg>