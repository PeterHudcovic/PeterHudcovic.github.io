name: Check CV server prerequisites
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cv-server-check.yml
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect existing web server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            python3 -c 'import hashlib, http.server; assert hasattr(hashlib, "scrypt")'
            echo 'Python runtime: OK'
            if sudo -n true 2>/dev/null; then echo 'Service setup permission: available'; else echo 'Service setup permission: restricted'; fi
            if command -v php >/dev/null 2>&1; then echo 'PHP runtime: available'; else echo 'PHP runtime: absent'; fi
            if find /etc/apache2/mods-enabled -maxdepth 1 -name 'php*.load' -print 2>/dev/null | grep -q .; then echo 'Apache PHP module: enabled'; else echo 'Apache PHP module: absent'; fi
            if find /etc/apache2/conf-enabled -maxdepth 1 -name '*fpm*' -print 2>/dev/null | grep -q .; then echo 'Apache PHP-FPM config: enabled'; else echo 'Apache PHP-FPM config: absent'; fi
            test -d /etc/apache2/sites-enabled
            test -d /var/www/html
            echo 'Expected hosting layout: OK'
            if ss -ltn | grep -q ':8766 '; then
              echo 'CV service port: already occupied'
              exit 1
            fi
            echo 'CV service port: available'
