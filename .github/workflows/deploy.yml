name: Deploy website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy private download endpoint
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          source: "cv-download.php"
          target: "/var/www/html"

      - name: Verify private endpoint before publishing the form
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            php -l /var/www/html/cv-download.php >/dev/null
            status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' https://peterhudcovic.tech/cv-download.php -H 'Origin: https://peterhudcovic.tech' -H 'Content-Type: application/json' --data '{"code":"deployment-readiness-check"}')
            test "$status" = 403
            echo 'Private CV endpoint ready; invalid code rejected'

      - name: Copy website file to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          source: "azure-case-study/images,output/pdf/Azure-Lab-Guide.pdf,output/pdf/Azure-Lab-Guide-3.pdf,index.html,flight-board-walkthrough.pdf,flight-board-departures.png,flight-board-first-deployment.jpg,flight-board-agent-worktrees.png,flight-board-peer-review.png,redef.svg,azure-appservice-resource-groups.png,azure-appservice-network-resources.png,azure-appservice-private-endpoint-nsg.png,azure-appservice-keyvault-private-dns.png,azure-appservice-devops-service-connections.png,azure-appservice-devops-agent-pools.png,azure-appservice-network-validation.png,azure-appservice-terraform-layers.png,azure-appservice-current-architecture.png,aix-lab.jpg,aix-powervs-evidence.png,aix-powerha-releasing.png,aix-powerha-acquiring.png,aix-powerha-online.png,aix-powerha-move-success.png,azure-lab-evidence.png,azure-resources-evidence.png,openshift-donation-lab.png,project_takeover.jpg,it-takeover-playbook.pdf,simple-project-roadmap.png,simple-project-roadmap.pdf"
          target: "/var/www/html"

      - name: Reload Apache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            rm -f /var/www/html/cv-setup.php
            sudo systemctl reload apache2
